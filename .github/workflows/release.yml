name: release

on:
  push:
    tags: ['v*']

jobs:
  build-and-release:
    # WPF projects need Windows.
    runs-on: windows-latest
    # The Azure federated credential trusts this environment; see docs/release-distribution.md.
    environment: release
    permissions:
      contents: write   # gh release create
      id-token: write   # OIDC login to Azure, no stored keys
    defaults:
      run:
        working-directory: application
    env:
      # The tag reaches scripts only through this variable, never pasted into them: a tag name could hold $(...).
      TAG: ${{ github.ref_name }}

    steps:
      - name: Check the tag
        shell: pwsh
        working-directory: .
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "Tag '$env:TAG' is not a version like v1.2.3." }

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore StockhogSolution.slnx

      - name: Restore local tools (wix)
        run: dotnet tool restore

      - name: Accept WiX Toolset EULA
        # Free for this project (OSMF only applies to orgs with >$10k/year revenue).
        # See https://www.firegiant.com/oss-maintenance-fee/
        run: dotnet wix eula accept wix7

      - name: Publish Stockhog.App (self-contained, win-x64)
        run: >
          dotnet publish Stockhog.App/Stockhog.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false
          -o ../dist

      - name: Publish Stockhog.EngineRunner (self-contained, win-x64)
        run: >
          dotnet publish Stockhog.EngineRunner/Stockhog.EngineRunner.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false
          -o ../dist

      - name: Build installer (.msi)
        shell: pwsh
        run: |
          $productVersion = $env:TAG -replace '^v', ''
          dotnet build installer/Stockhog.Installer/Stockhog.Installer.wixproj `
            -c Release `
            -p:PublishDir="$pwd/../dist" `
            -p:ProductVersion=$productVersion

      - name: Package
        shell: pwsh
        run: |
          $version = $env:TAG
          $zipName = "Stockhog-$version-win-x64.zip"
          Compress-Archive -Path dist/* -DestinationPath $zipName
          $hash = (Get-FileHash -Algorithm SHA256 $zipName).Hash.ToLower()
          "$hash  $zipName" | Out-File -Encoding utf8 "$zipName.sha256"
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

          $msiName = "Stockhog-$version-win-x64.msi"
          Copy-Item "application/installer/Stockhog.Installer/bin/Release/Stockhog-Setup.msi" $msiName
          $msiHash = (Get-FileHash -Algorithm SHA256 $msiName).Hash.ToLower()
          "$msiHash  $msiName" | Out-File -Encoding utf8 "$msiName.sha256"
          echo "MSI_NAME=$msiName" >> $env:GITHUB_ENV
        working-directory: .

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        working-directory: .
        run: |
          gh release create $env:TAG `
            "$env:ZIP_NAME" "$env:ZIP_NAME.sha256" `
            "$env:MSI_NAME" "$env:MSI_NAME.sha256" `
            --title $env:TAG `
            --generate-notes

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Upload to Azure Storage
        shell: pwsh
        working-directory: .
        run: |
          $version = $env:TAG
          $account = "emtradingstorage"
          $container = "releases"
          $base = "https://$account.blob.core.windows.net/$container"
          $common = @('--auth-mode', 'login', '--account-name', $account, '--container-name', $container, '--only-show-errors', '--no-progress', '--output', 'none')

          function Upload($file, $blobName, $contentType, $cacheControl, [switch]$Overwrite) {
            # @() keeps this an array: a bare `if` unwraps one item to a string, and splatting a string passes its characters.
            $extra = @(if ($Overwrite) { '--overwrite' })
            az storage blob upload @common --file $file --name $blobName `
              --content-type $contentType --content-cache-control $cacheControl @extra
            if ($LASTEXITCODE -ne 0) { throw "Upload of $blobName failed" }
          }

          # Versioned blobs are write-once: re-running a tag fails here instead of replacing a published build.
          $immutable = "public, max-age=31536000, immutable"
          Upload $env:MSI_NAME "$version/$env:MSI_NAME" "application/x-msi" $immutable
          Upload "$env:MSI_NAME.sha256" "$version/$env:MSI_NAME.sha256" "text/plain" $immutable
          Upload $env:ZIP_NAME "$version/$env:ZIP_NAME" "application/zip" $immutable
          Upload "$env:ZIP_NAME.sha256" "$version/$env:ZIP_NAME.sha256" "text/plain" $immutable

          # Stable links that always point at the newest release.
          $short = "public, max-age=300"
          Upload $env:MSI_NAME "latest/Stockhog-Setup.msi" "application/x-msi" $short -Overwrite
          # The app was called EmTrading before; links to its installer get the current one too.
          Upload $env:MSI_NAME "latest/EmTrading-Setup.msi" "application/x-msi" $short -Overwrite

          function Describe($file) {
            [ordered]@{
              name      = $file
              url       = "$base/$version/$file"
              sha256Url = "$base/$version/$file.sha256"
              size      = (Get-Item $file).Length
            }
          }
          [ordered]@{
            version     = $version
            publishedAt = (Get-Date).ToUniversalTime().ToString('o')
            msi         = Describe $env:MSI_NAME
            zip         = Describe $env:ZIP_NAME
          } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM latest.json
          Upload "latest.json" "latest.json" "application/json" $short -Overwrite
